[pytest]
# Configuration pytest pour Simba KYC

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Affichage amélioré
addopts = -v --tb=short --strict-markers

# Markers
markers =
    integration: Tests d'intégration (appelent les vrais endpoints)
    unit: Tests unitaires (testent les fonctions isolées)
    slow: Tests lents
    asyncio: Tests asynchrones
